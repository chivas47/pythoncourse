<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno de Python</title>
<meta name="description" content="Curso de Python do básico ao avançado, com prática a correr no browser, orientado para o primeiro emprego.">
<meta name="theme-color" content="#FBFAF7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FBFAF7;
  --grelha:#DFE5EE;
  --tinta:#16233B;
  --suave:#5B6577;
  --margem:#BF3B2B;
  --verde:#1B6E45;
  --marcador:rgba(247,203,72,.42);
  --caixa:#F2F0EA;
  --linha:#D8D4C9;
  --rail:52px;
  --passo:22px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  background-image:
    linear-gradient(var(--grelha) 1px, transparent 1px),
    linear-gradient(90deg, var(--grelha) 1px, transparent 1px);
  background-size:var(--passo) var(--passo);
  background-position:0 -1px;
  color:var(--tinta);
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:19px;
  line-height:1.62;
  -webkit-text-size-adjust:100%;
}
/* a margem vermelha do caderno atravessa a página inteira */
body::before{
  content:"";position:fixed;top:0;bottom:0;left:var(--rail);width:1px;
  background:var(--margem);opacity:.5;z-index:2;pointer-events:none;
}
.pag{padding:0 20px 120px var(--rail);max-width:820px}
.linha-rail{position:relative}
h1,h2,h3,.ui{font-family:"IBM Plex Sans",system-ui,sans-serif}
h1{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
h2{font-size:22px;font-weight:600;margin:34px 0 10px;letter-spacing:-.01em}
p{margin:0 0 16px;max-width:66ch}
a{color:var(--tinta);text-underline-offset:3px}
code{font-family:"IBM Plex Mono",monospace;font-size:.92em;background:var(--caixa);padding:1px 5px}
:focus-visible{outline:2px solid var(--margem);outline-offset:3px}

/* cabeçalho */
header{padding:26px 20px 18px var(--rail);position:relative}
.mini{font-family:"IBM Plex Sans";font-size:16px;color:var(--suave);margin:0 0 4px}
.marca{display:flex;align-items:baseline;gap:10px}
.marca b{font-weight:600}
.n-margem{position:absolute;left:0;width:var(--rail);text-align:center;
  font-family:"IBM Plex Mono";font-size:16px;color:var(--margem);padding-top:4px}

/* consola do topo */
.consola{border:1px solid var(--tinta);background:#fff;margin:8px 0 26px;max-width:660px}
.consola-topo{display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;border-bottom:1px solid var(--linha);font-family:"IBM Plex Sans";font-size:16px;color:var(--suave)}
.consola-corpo{font-family:"IBM Plex Mono";font-size:17px;padding:14px 12px;white-space:pre-wrap;word-break:break-word}
.prompt{color:var(--margem)}
.cursor{display:inline-block;width:9px;height:19px;background:var(--tinta);vertical-align:-3px;animation:pisca 1.1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}

/* botões */
button{font-family:"IBM Plex Sans";font-size:17px;cursor:pointer}
.btn{background:var(--tinta);color:var(--papel);border:1px solid var(--tinta);
  padding:11px 18px;min-height:46px}
.btn:active{transform:translateY(1px)}
.btn.claro{background:transparent;color:var(--tinta)}
.btn[disabled]{opacity:.5;cursor:default}

/* blocos de conteúdo */
.bloco-code{position:relative;background:var(--caixa);border-left:2px solid var(--tinta);
  margin:0 0 20px;overflow-x:auto}
pre{margin:0;padding:14px 14px 14px 16px;font-family:"IBM Plex Mono";font-size:17px;line-height:1.55}
.k{color:#8A3FA0;font-style:normal;font-weight:500}
.s{color:var(--verde);font-style:normal}
.c{color:var(--suave);font-style:italic}
.nm{color:#9A5B18;font-style:normal}
.acoes{display:flex;gap:8px;padding:0 0 20px}
.saida{border-left:2px solid var(--verde);background:#fff;padding:10px 14px;margin:-14px 0 20px;
  font-family:"IBM Plex Mono";font-size:16px;white-space:pre-wrap}
.saida.mau{border-color:var(--margem)}
.obra{background:linear-gradient(transparent 12%, var(--marcador) 12%, var(--marcador) 88%, transparent 88%);
  padding:2px 0;margin:0 0 20px;max-width:64ch}
.aviso{border-left:2px solid var(--margem);padding:2px 0 2px 14px;margin:0 0 20px;max-width:64ch;color:var(--tinta)}
.rotulo{font-family:"IBM Plex Sans";font-size:16px;color:var(--suave);display:block}
ul{padding-left:22px;max-width:66ch}li{margin-bottom:8px}

/* índice */
.fase{margin:0 0 30px}
.fase-cab{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--tinta);padding-bottom:6px}
.fase-cab h2{margin:0}
.mod{display:block;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--linha);position:relative}
.mod b{font-family:"IBM Plex Sans";font-weight:500;font-size:19px}
.mod span{display:block;color:var(--suave);font-size:17px;font-family:"IBM Plex Sans"}
.mod .num{position:absolute;left:calc(-1 * var(--rail));width:var(--rail);text-align:center;
  font-family:"IBM Plex Mono";color:var(--margem);font-size:16px}
.mod .tick{position:absolute;left:calc(-1 * var(--rail));width:var(--rail);text-align:center;color:var(--verde)}

/* lições */
.licao{display:flex;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--linha);text-decoration:none}
.licao .id{font-family:"IBM Plex Mono";font-size:16px;color:var(--margem);min-width:34px}
.licao .tt{font-family:"IBM Plex Sans";font-size:18px}
.licao .dur{margin-left:auto;font-family:"IBM Plex Mono";font-size:16px;color:var(--suave)}
.esboco{opacity:.55}

/* exercício */
.ex{border:1px solid var(--tinta);background:#fff;margin:24px 0}
.ex-cab{padding:12px 14px;border-bottom:1px solid var(--linha);font-family:"IBM Plex Sans";font-size:17px}
.ex-corpo{padding:14px}
textarea{width:100%;min-height:200px;border:1px solid var(--linha);background:var(--caixa);
  font-family:"IBM Plex Mono";font-size:17px;line-height:1.55;padding:12px;resize:vertical;color:var(--tinta)}
.teclas{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.teclas button{border:1px solid var(--linha);background:#fff;min-width:44px;min-height:42px;
  font-family:"IBM Plex Mono";font-size:17px}
.res{margin-top:12px;font-family:"IBM Plex Sans";font-size:17px}
.res div{display:flex;gap:8px;padding:4px 0}
.ok{color:var(--verde)}.mau{color:var(--margem)}

/* quiz */
.quiz{border-top:1px solid var(--tinta);padding-top:16px;margin-top:30px}
.opc{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--linha);
  padding:12px 14px;margin-bottom:8px;font-size:18px;font-family:"IBM Plex Sans"}
.opc.certa{border-color:var(--verde);background:#F1F7F3}
.opc.errada{border-color:var(--margem);background:#FBF1EF}

/* navegação inferior */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--papel);
  border-top:1px solid var(--tinta);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:12px 4px;text-decoration:none;font-family:"IBM Plex Sans";font-size:17px;color:var(--suave)}
nav a.on{color:var(--tinta);box-shadow:inset 0 3px 0 var(--margem)}
.progresso{height:3px;background:var(--linha);margin:10px 0 0;max-width:660px}
.progresso i{display:block;height:3px;background:var(--margem)}

@media (min-width:900px){
  :root{--rail:96px}
  .pag,header{max-width:900px;padding-right:40px}
  body{font-size:20px}
  h1{font-size:38px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="n-margem" id="marg">py</div>
  <p class="mini">Caderno de exercícios</p>
  <div class="marca"><h1>Python até ao primeiro emprego</h1></div>
  <p class="mini" id="sub">Do primeiro comando no terminal ao primeiro emprego.</p>
  <div class="progresso"><i id="barra" style="width:0"></i></div>
</header>

<main class="pag" id="app"></main>

<nav>
  <a href="#/" id="nav-curso">Curso</a>
  <a href="#/praticar" id="nav-praticar">Praticar</a>
  <a href="#/percurso" id="nav-percurso">Percurso</a>
</nav>

<script src="curso.js"></script>
<script>
const PYV = "0.27.2"; // versão do motor de Python; para atualizar, muda só aqui
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------- memória local ---------- */
const CH = 'caderno-py:';
const guarda = (k,v) => { try{ localStorage.setItem(CH+k, JSON.stringify(v)); }catch(e){} };
const le = (k,d) => { try{ const v = localStorage.getItem(CH+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
let feitas = le('feitas', {});
const marcar = id => { feitas[id] = true; guarda('feitas', feitas); pintarBarra(); };

const todasLicoes = () => CURSO.modulos.flatMap(m => m.licoes.map(l => ({...l, mod:m})));
const prontas = () => todasLicoes().filter(l => l.estado === 'pronta');
function pintarBarra(){
  const t = prontas().length || 1;
  const f = prontas().filter(l => feitas[l.id]).length;
  document.getElementById('barra').style.width = Math.round(f/t*100) + '%';
}

/* ---------- realce de sintaxe ---------- */
const PALAVRAS = /^(def|class|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|with|try|except|finally|raise|yield|lambda|None|True|False|pass|break|continue|assert|global|nonlocal|async|await|del)$/;
function realce(src){
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)\b/g;
  let out = '', ult = 0, m;
  while((m = re.exec(src))){
    out += esc(src.slice(ult, m.index));
    if(m[1]) out += '<i class="c">'+esc(m[1])+'</i>';
    else if(m[2]) out += '<i class="s">'+esc(m[2])+'</i>';
    else if(m[3]) out += '<i class="nm">'+esc(m[3])+'</i>';
    else out += PALAVRAS.test(m[4]) ? '<i class="k">'+m[4]+'</i>' : esc(m[4]);
    ult = re.lastIndex;
  }
  return out + esc(src.slice(ult));
}
const emLinha = t => esc(t).replace(/`([^`]+)`/g, '<code>$1</code>');

/* ---------- motor de Python ---------- */
let motor = null;
function carregarMotor(aviso){
  if(motor) return motor;
  motor = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `https://cdn.jsdelivr.net/pyodide/v${PYV}/full/pyodide.js`;
    s.onload = async () => {
      try { res(await loadPyodide({ indexURL:`https://cdn.jsdelivr.net/pyodide/v${PYV}/full/` })); }
      catch(e){ motor = null; rej(e); }
    };
    s.onerror = () => { motor = null; rej(new Error('Sem ligação ao motor de Python. Verifica a internet e tenta outra vez.')); };
    document.head.appendChild(s);
  });
  if(aviso) aviso('A carregar o Python (só na primeira vez, cerca de 6 MB)...');
  return motor;
}
async function correrPython(codigo, testes){
  const py = await carregarMotor();
  const saida = [];
  py.setStdout({ batched: t => saida.push(t) });
  py.setStderr({ batched: t => saida.push(t) });
  const ns = py.runPython('{}');
  let erro = null, resultados = [];
  try{
    py.runPython(codigo, { globals: ns });
    if(testes){
      py.runPython('_res = []\ndef verifica(nome, cond):\n    _res.append((nome, bool(cond)))\n', { globals: ns });
      // se os testes rebentarem a meio, guardamos na mesma o que já tinha corrido
      try{ py.runPython(testes, { globals: ns }); }
      finally{
        const r = ns.get('_res');
        if(r){ resultados = r.toJs().map(t => ({ nome:t[0], ok:t[1] })); r.destroy(); }
      }
    }
  }catch(e){ erro = String(e.message || e).trim(); }
  ns.destroy();
  return { saida: saida.join('\n'), erro, resultados };
}

/* ---------- blocos ---------- */
function blocoCode(codigo, corrivel){
  const id = 'c' + Math.random().toString(36).slice(2, 8);
  return `<div class="bloco-code"><pre id="${id}">${realce(codigo)}</pre></div>` +
    (corrivel ? `<div class="acoes"><button class="btn claro" data-correr="${id}">Correr</button>
       <button class="btn claro" data-copiar="${id}">Copiar</button></div>
       <div class="saida" id="s-${id}" hidden></div>` : '');
}
function renderBlocos(blocos){
  return blocos.map(b => {
    const [t, v] = b;
    if(t === 'p') return `<p>${emLinha(v)}</p>`;
    if(t === 'h') return `<h2>${esc(v)}</h2>`;
    if(t === 'lista') return `<ul>${v.map(i => `<li>${emLinha(i)}</li>`).join('')}</ul>`;
    if(t === 'code') return blocoCode(v, false);
    if(t === 'py') return blocoCode(v, true);
    if(t === 'obra') return `<p class="obra"><span class="rotulo">No trabalho</span>${emLinha(v)}</p>`;
    if(t === 'aviso') return `<p class="aviso"><span class="rotulo">Onde as pessoas tropeçam</span>${emLinha(v)}</p>`;
    return '';
  }).join('');
}

/* ---------- vistas ---------- */
function vistaIndice(){
  document.getElementById('sub').textContent =
    `${CURSO.modulos.length} módulos, ${prontas().length} aulas, prática a correr no browser.`;
  const consola = `
   <div class="consola">
     <div class="consola-topo"><span>consola de Python</span><span>corre no teu telemóvel</span></div>
     <div class="consola-corpo" id="repl-saida"><span class="prompt">&gt;&gt;&gt; </span>print("olá, primeiro emprego")<span class="cursor"></span></div>
     <div style="padding:0 12px 12px"><button class="btn" id="repl-btn">Correr esta linha</button></div>
   </div>`;
  const fases = CURSO.fases.map(f => {
    const mods = CURSO.modulos.filter(m => m.fase === f.id).map(m => {
      const done = m.licoes.filter(l => l.estado === 'pronta' && feitas[l.id]).length;
      const total = m.licoes.filter(l => l.estado === 'pronta').length;
      const marca = total && done === total ? '<span class="tick">v</span>' : `<span class="num">${m.n}</span>`;
      return `<a class="mod" href="#/m/${m.n}">${marca}<b>${esc(m.titulo)}</b><span>${esc(m.objetivo)}</span></a>`;
    }).join('');
    return `<section class="fase"><div class="fase-cab"><h2>${esc(f.nome)}</h2></div>
      <p class="mini" style="margin:8px 0 4px">${esc(f.nota)}</p>${mods}</section>`;
  }).join('');
  app.innerHTML = consola + fases;
  document.getElementById('repl-btn').onclick = async e => {
    const alvo = document.getElementById('repl-saida');
    e.target.disabled = true; e.target.textContent = 'A carregar...';
    try{
      const r = await correrPython('print("olá, primeiro emprego")');
      alvo.innerHTML = '<span class="prompt">&gt;&gt;&gt; </span>print("olá, primeiro emprego")\n' + esc(r.saida) + '<span class="prompt">&gt;&gt;&gt; </span><span class="cursor"></span>';
      e.target.remove();
    }catch(err){
      alvo.innerHTML += '\n' + esc(err.message);
      e.target.disabled = false; e.target.textContent = 'Tentar outra vez';
    }
  };
}

function vistaModulo(n){
  const m = CURSO.modulos.find(x => x.n === +n);
  if(!m) return vistaIndice();
  document.getElementById('sub').textContent = m.objetivo;
  app.innerHTML = `<p class="mini"><a href="#/">Voltar ao curso</a></p>
    <h1>${esc(m.titulo)}</h1><p>${esc(m.objetivo)}</p>` +
    m.licoes.map(l => `<a class="licao ${l.estado === 'esboco' ? 'esboco' : ''}" href="#/l/${l.id}">
      <span class="id">${feitas[l.id] ? 'v' : l.id}</span>
      <span class="tt">${esc(l.titulo)}<br><span class="mini">${esc(l.meta || '')}</span></span>
      <span class="dur">${l.min}m</span></a>`).join('');
}

function vistaLicao(id){
  const l = todasLicoes().find(x => x.id === id);
  if(!l) return vistaIndice();
  document.getElementById('sub').textContent = l.titulo;
  if(l.estado === 'esboco'){
    app.innerHTML = `<p class="mini"><a href="#/m/${l.mod.n}">Voltar ao módulo ${l.mod.n}</a></p>
      <h1>${esc(l.titulo)}</h1><p>${esc(l.meta)}</p>
      <p class="aviso"><span class="rotulo">Ainda por escrever</span>Esta aula está planeada mas o conteúdo não está feito. O plano acima é o que ela vai cobrir.</p>`;
    return;
  }
  app.innerHTML = `<p class="mini"><a href="#/m/${l.mod.n}">Módulo ${l.mod.n}</a></p>
    <h1>${esc(l.titulo)}</h1><p class="mini" style="margin-bottom:22px">${esc(l.meta)}</p>
    ${renderBlocos(l.blocos)}
    ${l.exercicio ? caixaExercicio(l) : ''}
    ${l.quiz ? caixaQuiz(l) : ''}
    <p style="margin-top:34px"><button class="btn" id="concluir">${feitas[l.id] ? 'Aula concluída' : 'Marcar como concluída'}</button></p>`;
  ligarBotoes();
  const b = document.getElementById('concluir');
  b.onclick = () => { marcar(l.id); b.textContent = 'Aula concluída'; };
}

function caixaExercicio(l){
  return `<div class="ex" id="ex">
    <div class="ex-cab">Exercício</div>
    <div class="ex-corpo">
      <p style="margin-bottom:12px">${emLinha(l.exercicio.enunciado)}</p>
      <textarea id="editor" spellcheck="false" autocapitalize="off" autocorrect="off">${esc(l.exercicio.inicio || '')}</textarea>
      <div class="teclas" id="teclas"></div>
      <button class="btn" id="testar">Correr testes</button>
      <div class="res" id="res"></div>
    </div></div>`;
}

function caixaQuiz(l){
  return `<div class="quiz"><h2>Verificação</h2>` + l.quiz.map((q, i) =>
    `<p>${emLinha(q.p)}</p>` + q.o.map((o, j) =>
      `<button class="opc" data-q="${i}" data-o="${j}">${esc(o)}</button>`).join('') +
    `<p class="mini" id="expl-${i}" hidden>${emLinha(q.e)}</p>`).join('') + `</div>`;
}

function vistaPraticar(){
  document.getElementById('sub').textContent = 'Todos os exercícios do curso, num sítio só.';
  const lst = prontas().filter(l => l.exercicio);
  app.innerHTML = `<h1>Praticar</h1><p>Cada exercício corre testes a sério contra o teu código. Podes fazê-los fora de ordem.</p>` +
    lst.map(l => `<a class="licao" href="#/l/${l.id}"><span class="id">${feitas[l.id] ? 'v' : l.id}</span>
      <span class="tt">${esc(l.titulo)}<br><span class="mini">Módulo ${l.mod.n}</span></span></a>`).join('');
}

function vistaPercurso(){
  const t = prontas().length, f = prontas().filter(l => feitas[l.id]).length;
  document.getElementById('sub').textContent = `${f} de ${t} aulas concluídas`;
  app.innerHTML = `<h1>Percurso</h1>
    <p>Aulas escritas: ${t}. Concluídas: ${f}. Estão todas escritas, com exercício e testes: podes fazê-las por ordem ou ir buscar o que precisas.</p>
    <h2>O que precisas de mostrar a quem recruta</h2>
    <ul>
      <li>Um repositório com testes a passar e um README que explica o problema, não a tecnologia.</li>
      <li>Histórico de commits pequenos e legíveis, feitos ao longo de semanas.</li>
      <li>Um projeto que consumas dados reais e trate falhas.</li>
      <li>Saber explicar em voz alta uma decisão que tomaste e o que rejeitaste.</li>
    </ul>
    <p style="margin-top:26px"><button class="btn claro" id="limpar">Apagar o meu progresso</button></p>`;
  document.getElementById('limpar').onclick = () => {
    if(confirm('Apagar o progresso guardado neste dispositivo?')){ feitas = {}; guarda('feitas', {}); pintarBarra(); vistaPercurso(); }
  };
}

/* ---------- interações ---------- */
function ligarBotoes(){
  document.querySelectorAll('[data-correr]').forEach(b => {
    b.onclick = async () => {
      const pre = document.getElementById(b.dataset.correr);
      const out = document.getElementById('s-' + b.dataset.correr);
      out.hidden = false; out.className = 'saida'; out.textContent = 'A carregar o Python (só na primeira vez)...';
      b.disabled = true;
      try{
        const r = await correrPython(pre.textContent);
        // mostra a saída antes do erro: há blocos que imprimem e só depois rebentam de propósito
        out.textContent = (r.saida ? r.saida + '\n' : '') + (r.erro || (r.saida ? '' : '(sem saída)'));
        out.className = 'saida' + (r.erro ? ' mau' : '');
      }catch(e){ out.textContent = e.message; out.className = 'saida mau'; }
      b.disabled = false;
    };
  });
  document.querySelectorAll('[data-copiar]').forEach(b => {
    b.onclick = () => {
      navigator.clipboard.writeText(document.getElementById(b.dataset.copiar).textContent);
      b.textContent = 'Copiado';
      setTimeout(() => b.textContent = 'Copiar', 1500);
    };
  });

  const ed = document.getElementById('editor');
  if(ed){
    // teclado auxiliar: os telemóveis não têm tab nem estes símbolos à mão
    const teclas = ['    ', ':', '(', ')', '[', ']', '{', '}', '"', '_', '=', '#'];
    document.getElementById('teclas').innerHTML = teclas.map(t =>
      `<button data-t="${t === '    ' ? 'IND' : esc(t)}">${t === '    ' ? '→|' : esc(t)}</button>`).join('');
    document.querySelectorAll('#teclas button').forEach(b => {
      b.onclick = () => inserir(ed, b.dataset.t === 'IND' ? '    ' : b.dataset.t);
    });
    ed.addEventListener('keydown', e => {
      if(e.key === 'Tab'){ e.preventDefault(); inserir(ed, '    '); }
    });
    const l = todasLicoes().find(x => x.id === location.hash.split('/')[2]);
    document.getElementById('testar').onclick = async ev => {
      const res = document.getElementById('res');
      res.innerHTML = '<div>A carregar o Python (só na primeira vez)...</div>';
      ev.target.disabled = true;
      try{
        const r = await correrPython(ed.value, l.exercicio.testes);
        if(r.erro){
          res.innerHTML = r.resultados.map(x =>
            `<div class="${x.ok ? 'ok' : 'mau'}">${x.ok ? 'v' : 'x'} ${esc(x.nome)}</div>`).join('') +
            `<div class="mau">O código rebentou:</div><pre style="padding:8px 0;font-size:16px">${esc(r.erro)}</pre>`;
        }else{
          const passou = r.resultados.every(x => x.ok) && r.resultados.length > 0;
          res.innerHTML = r.resultados.map(x =>
            `<div class="${x.ok ? 'ok' : 'mau'}">${x.ok ? 'v' : 'x'} ${esc(x.nome)}</div>`).join('') +
            (r.saida ? `<pre style="padding:8px 0;font-size:16px">${esc(r.saida)}</pre>` : '') +
            (passou ? '<div class="ok" style="margin-top:8px">Todos os testes passam.</div>' : '');
          if(passou) marcar(l.id);
        }
      }catch(e){ res.innerHTML = `<div class="mau">${esc(e.message)}</div>`; }
      ev.target.disabled = false;
    };
  }

  document.querySelectorAll('.opc').forEach(b => {
    b.onclick = () => {
      const q = +b.dataset.q, o = +b.dataset.o;
      const lic = todasLicoes().find(x => x.id === location.hash.split('/')[2]);
      const certa = lic.quiz[q].c;
      document.querySelectorAll(`.opc[data-q="${q}"]`).forEach(x => {
        if(+x.dataset.o === certa) x.classList.add('certa');
      });
      if(o !== certa) b.classList.add('errada');
      document.getElementById('expl-' + q).hidden = false;
    };
  });
}
function inserir(ed, txt){
  const i = ed.selectionStart, f = ed.selectionEnd;
  ed.value = ed.value.slice(0, i) + txt + ed.value.slice(f);
  ed.selectionStart = ed.selectionEnd = i + txt.length;
  ed.focus();
}

/* ---------- rotas ---------- */
function rotear(){
  const h = location.hash.replace('#/', '') || '';
  const p = h.split('/');
  window.scrollTo(0, 0);
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('on'));
  const marg = document.getElementById('marg');
  if(p[0] === 'm'){ vistaModulo(p[1]); marg.textContent = p[1]; document.getElementById('nav-curso').classList.add('on'); }
  else if(p[0] === 'l'){ vistaLicao(p[1]); marg.textContent = p[1]; document.getElementById('nav-curso').classList.add('on'); }
  else if(p[0] === 'praticar'){ vistaPraticar(); marg.textContent = 'ex'; document.getElementById('nav-praticar').classList.add('on'); }
  else if(p[0] === 'percurso'){ vistaPercurso(); marg.textContent = '%'; document.getElementById('nav-percurso').classList.add('on'); }
  else { vistaIndice(); marg.textContent = 'py'; document.getElementById('nav-curso').classList.add('on'); }
}
window.addEventListener('hashchange', rotear);
pintarBarra();
rotear();
</script>
