<!-- Corredor de testes para a verificação no browser. É Python, lido pelo motor quando é preciso. -->
<script type="text/x-python" id="corredor">
# Corredor de testes do Caderno.
# Um subconjunto do pytest para o browser, onde o pytest verdadeiro não está instalado.
# Suporta: funções e classes test_*, assert, pytest.raises, pytest.approx,
# pytest.mark.parametrize, pytest.fixture (com yield), e as fixtures
# tmp_path, capsys, monkeypatch e caplog.
import builtins
import collections
import importlib
import inspect
import io
import itertools
import json
import linecache
import logging
import os
import sys
import tempfile
import traceback
import types
from pathlib import Path


class _Ignorado(Exception):
    pass


class _Raises:
    def __init__(self, excecao, match=None):
        self.excecao = excecao
        self.match = match
        self.value = None
        self.type = None

    def __enter__(self):
        return self

    def __exit__(self, tipo, valor, tb):
        nomes = getattr(self.excecao, "__name__", None) or " ou ".join(e.__name__ for e in self.excecao)
        if tipo is None:
            raise AssertionError(f"era esperado {nomes} e não foi levantado nada")
        if not issubclass(tipo, self.excecao):
            return False
        if self.match is not None:
            import re
            if not re.search(self.match, str(valor)):
                raise AssertionError(f"a mensagem {str(valor)!r} não corresponde a {self.match!r}")
        self.value = valor
        self.type = tipo
        return True


class _Approx:
    def __init__(self, esperado, rel=None, abs=None):
        self.esperado = esperado
        self.rel = 1e-6 if rel is None else rel
        self.abs = 1e-12 if abs is None else abs

    def _perto(self, a, b):
        if isinstance(b, (list, tuple)):
            return isinstance(a, (list, tuple)) and len(a) == len(b) and all(self._perto(x, y) for x, y in zip(a, b))
        if isinstance(b, dict):
            return isinstance(a, dict) and a.keys() == b.keys() and all(self._perto(a[k], b[k]) for k in b)
        try:
            return a == b or abs(a - b) <= max(self.rel * abs(b), self.abs)
        except TypeError:
            return False

    def __eq__(self, outro):
        return self._perto(outro, self.esperado)

    def __repr__(self):
        return f"approx({self.esperado!r})"


class _Mark:
    def parametrize(self, nomes, valores, ids=None):
        def decorar(f):
            f.__dict__.setdefault("_parametros", []).insert(0, (nomes, list(valores), ids))
            return f
        return decorar

    def __getattr__(self, nome):
        def marca(*a, **k):
            if len(a) == 1 and callable(a[0]) and not k:
                return a[0]
            return lambda f: f
        return marca


def _fixture(f=None, **opcoes):
    def decorar(fn):
        fn._e_fixture = True
        fn._autouse = opcoes.get("autouse", False)
        return fn
    return decorar(f) if callable(f) else decorar


def _fail(msg=""):
    raise AssertionError(msg)


def _skip(msg=""):
    raise _Ignorado(msg)


def _modulo_pytest():
    m = types.ModuleType("pytest")
    m.raises = _Raises
    m.approx = _Approx
    m.mark = _Mark()
    m.fixture = _fixture
    m.fail = _fail
    m.skip = _skip
    m.__caderno__ = True
    return m


_NADA = object()


class _MonkeyPatch:
    def __init__(self):
        self._desfazer = []

    def _alvo(self, alvo, nome):
        if isinstance(alvo, str) and nome is _NADA:
            caminho, _, atributo = alvo.rpartition(".")
            partes = caminho.split(".")
            obj = importlib.import_module(partes[0])
            for i, p in enumerate(partes[1:], 1):
                try:
                    obj = getattr(obj, p)
                except AttributeError:
                    obj = importlib.import_module(".".join(partes[: i + 1]))
            return obj, atributo
        return alvo, nome

    def setattr(self, alvo, nome, valor=_NADA, raising=True):
        if valor is _NADA:
            alvo, nome, valor = (*self._alvo(alvo, _NADA), nome)
        antigo = getattr(alvo, nome, _NADA)
        if antigo is _NADA and raising:
            raise AttributeError(f"{alvo!r} não tem o atributo {nome!r}")
        self._desfazer.append(lambda: setattr(alvo, nome, antigo) if antigo is not _NADA else delattr(alvo, nome))
        setattr(alvo, nome, valor)

    def delattr(self, alvo, nome=_NADA, raising=True):
        alvo, nome = self._alvo(alvo, nome)
        if not hasattr(alvo, nome):
            if raising:
                raise AttributeError(nome)
            return
        antigo = getattr(alvo, nome)
        self._desfazer.append(lambda: setattr(alvo, nome, antigo))
        delattr(alvo, nome)

    def setitem(self, d, chave, valor):
        antigo = d.get(chave, _NADA)
        self._desfazer.append(lambda: d.__setitem__(chave, antigo) if antigo is not _NADA else d.pop(chave, None))
        d[chave] = valor

    def delitem(self, d, chave, raising=True):
        if chave not in d:
            if raising:
                raise KeyError(chave)
            return
        antigo = d[chave]
        self._desfazer.append(lambda: d.__setitem__(chave, antigo))
        del d[chave]

    def setenv(self, nome, valor, prepend=None):
        self.setitem(os.environ, nome, str(valor))

    def delenv(self, nome, raising=True):
        self.delitem(os.environ, nome, raising)

    def chdir(self, caminho):
        antigo = os.getcwd()
        self._desfazer.append(lambda: os.chdir(antigo))
        os.chdir(caminho)

    def syspath_prepend(self, caminho):
        antigo = list(sys.path)
        self._desfazer.append(lambda: sys.path.__setitem__(slice(None), antigo))
        sys.path.insert(0, str(caminho))

    def undo(self):
        while self._desfazer:
            self._desfazer.pop()()


_Captura = collections.namedtuple("CaptureResult", "out err")


class _Capsys:
    def __init__(self, corredor):
        self._c = corredor

    def readouterr(self):
        out, err = self._c.saida.getvalue(), self._c.erros.getvalue()
        self._c.saida.seek(0)
        self._c.saida.truncate()
        self._c.erros.seek(0)
        self._c.erros.truncate()
        return _Captura(out, err)


class _Caplog(logging.Handler):
    def __init__(self):
        super().__init__(0)
        self.records = []
        self._niveis = []
        logging.getLogger().addHandler(self)

    def emit(self, registo):
        self.records.append(registo)

    @property
    def messages(self):
        return [r.getMessage() for r in self.records]

    @property
    def text(self):
        return "\n".join(f"{r.levelname} {r.name}:{r.getMessage()}" for r in self.records)

    @property
    def record_tuples(self):
        return [(r.name, r.levelno, r.getMessage()) for r in self.records]

    def clear(self):
        self.records.clear()

    def set_level(self, nivel, logger=None):
        alvo = logging.getLogger(logger)
        self._niveis.append((alvo, alvo.level))
        alvo.setLevel(nivel)

    def fechar(self):
        logging.getLogger().removeHandler(self)
        for alvo, nivel in reversed(self._niveis):
            alvo.setLevel(nivel)


def _input_sem_resposta(pergunta=""):
    raise OSError("input() foi chamado sem o teste lhe dar uma resposta")


def _nome_bonito(nome):
    nome = nome[5:] if nome.startswith("test_") else nome
    return nome.replace("_", " ").strip()


class Corredor:
    def __init__(self, pasta, ficheiro_testes):
        self.pasta = os.path.abspath(str(pasta))
        self.ficheiro_testes = ficheiro_testes
        self.saida = io.StringIO()
        self.erros = io.StringIO()
        self.resultados = []
        self.impresso = []

    def _linha_do_teste(self, tb):
        caminho = os.path.join(self.pasta, self.ficheiro_testes)
        quadro_teste = None
        while tb is not None:
            if os.path.abspath(tb.tb_frame.f_code.co_filename) == caminho:
                quadro_teste = (tb.tb_frame, tb.tb_lineno)
            tb = tb.tb_next
        if quadro_teste is None:
            return None, "", ""
        quadro, n = quadro_teste
        linha = linecache.getline(caminho, n).strip()
        return n, linha, self._explicar(linha, quadro)

    def _explicar(self, linha, quadro):
        # Mostra o valor obtido quando o assert é uma comparação simples, como faz o pytest.
        import ast
        try:
            no = ast.parse(linha).body[0]
            teste = no.test
            if not isinstance(teste, ast.Compare) or len(teste.ops) != 1:
                return ""
            esquerda = eval(compile(ast.Expression(teste.left), "<assert>", "eval"), quadro.f_globals, quadro.f_locals)
            direita = eval(compile(ast.Expression(teste.comparators[0]), "<assert>", "eval"), quadro.f_globals, quadro.f_locals)
        except Exception:
            return ""
        curto = lambda v: (repr(v)[:300] + "...") if len(repr(v)) > 300 else repr(v)
        return f"obtido:   {curto(esquerda)}\nesperado: {curto(direita)}"

    def _onde_no_aluno(self, tb):
        for quadro in reversed(traceback.extract_tb(tb)):
            nome = os.path.basename(quadro.filename)
            if os.path.dirname(os.path.abspath(quadro.filename)) == os.path.abspath(self.pasta) and nome != self.ficheiro_testes:
                return f"{nome}, linha {quadro.lineno}: {(quadro.line or '').strip()}"
        return ""

    def _fixture(self, nome, modulo, cache, finais, parametros):
        if nome in parametros:
            return parametros[nome]
        if nome in cache:
            return cache[nome]
        if nome == "tmp_path":
            valor = Path(tempfile.mkdtemp(dir=self.pasta_temporaria))
        elif nome == "capsys":
            valor = _Capsys(self)
        elif nome == "monkeypatch":
            valor = _MonkeyPatch()
            finais.append(valor.undo)
        elif nome == "caplog":
            valor = _Caplog()
            finais.append(valor.fechar)
        else:
            f = getattr(modulo, nome, None)
            if f is None or not getattr(f, "_e_fixture", False):
                raise LookupError(f"fixture '{nome}' não encontrada")
            args = {p: self._fixture(p, modulo, cache, finais, parametros) for p in inspect.signature(f).parameters}
            valor = f(**args)
            if inspect.isgenerator(valor):
                gerador = valor
                valor = next(gerador)
                finais.append(lambda: next(gerador, None))
        cache[nome] = valor
        return valor

    def _casos(self, f):
        grupos = getattr(f, "_parametros", [])
        if not grupos:
            return [({}, "")]
        expandidos = []
        for nomes, valores, ids in grupos:
            chaves = [n.strip() for n in nomes.split(",")] if isinstance(nomes, str) else list(nomes)
            opcoes = []
            for i, v in enumerate(valores):
                v = (v,) if len(chaves) == 1 else tuple(v)
                ident = ids[i] if ids else "-".join(str(x) for x in v)
                opcoes.append((dict(zip(chaves, v)), ident))
            expandidos.append(opcoes)
        casos = []
        for combinacao in itertools.product(*expandidos):
            parametros = {}
            for p, _ in combinacao:
                parametros.update(p)
            casos.append((parametros, "-".join(i for _, i in combinacao)))
        return casos

    def _correr_um(self, nome, f, modulo, parametros, ident):
        titulo = _nome_bonito(nome.rpartition(".")[2]) + (f" [{ident}]" if ident else "")
        cache, finais = {}, []
        resultado = {"nome": titulo, "ok": False, "detalhe": ""}
        self.impresso.append(self.saida.getvalue())
        for buffer in (self.saida, self.erros):
            buffer.seek(0)
            buffer.truncate()
        try:
            for nome_fixture, objeto in vars(modulo).items():
                if getattr(objeto, "_autouse", False):
                    self._fixture(nome_fixture, modulo, cache, finais, parametros)
            args = {p: self._fixture(p, modulo, cache, finais, parametros) for p in inspect.signature(f).parameters if p != "self"}
            f(**args)
            resultado["ok"] = True
        except _Ignorado as e:
            resultado.update(ok=True, detalhe=f"ignorado: {e}")
        except AssertionError as e:
            linha_n, linha, valores = self._linha_do_teste(e.__traceback__)
            msg = str(e).strip()
            partes = [f"linha {linha_n}: {linha}" if linha_n else "", msg, valores]
            resultado["detalhe"] = "\n".join(p for p in partes if p)
        except Exception as e:
            onde = self._onde_no_aluno(e.__traceback__)
            resultado["detalhe"] = f"{type(e).__name__}: {e}" + (f"\nem {onde}" if onde else "")
        finally:
            for fim in reversed(finais):
                try:
                    fim()
                except Exception:
                    pass
        self.resultados.append(resultado)

    def correr(self):
        self.pasta_temporaria = tempfile.mkdtemp()
        nomes_locais = [p[:-3] for p in os.listdir(self.pasta) if p.endswith(".py")]
        for n in nomes_locais:
            sys.modules.pop(n, None)
        if "pytest" not in sys.modules or getattr(sys.modules["pytest"], "__caderno__", False):
            sys.modules["pytest"] = _modulo_pytest()
        caminho_antigo, pasta_antiga = list(sys.path), os.getcwd()
        stdout, stderr, entrada = sys.stdout, sys.stderr, builtins.input
        sys.path.insert(0, self.pasta)
        os.chdir(self.pasta)
        importlib.invalidate_caches()
        sys.stdout, sys.stderr = self.saida, self.erros
        builtins.input = _input_sem_resposta
        erro_import = None
        try:
            modulo = importlib.import_module(self.ficheiro_testes[:-3])
            for nome, obj in list(vars(modulo).items()):
                if nome.startswith("test") and inspect.isfunction(obj):
                    for parametros, ident in self._casos(obj):
                        self._correr_um(nome, obj, modulo, parametros, ident)
                elif nome.startswith("Test") and inspect.isclass(obj):
                    for metodo, f in list(vars(obj).items()):
                        if metodo.startswith("test") and inspect.isfunction(f):
                            for parametros, ident in self._casos(f):
                                self._correr_um(f"{nome}.{metodo}", getattr(obj(), metodo), modulo, parametros, ident)
        except BaseException as e:
            onde = self._onde_no_aluno(e.__traceback__)
            if isinstance(e, SyntaxError):
                onde = f"{os.path.basename(e.filename or '')}, linha {e.lineno}: {(e.text or '').strip()}"
            erro_import = f"{type(e).__name__}: {e}" + (f"\nem {onde}" if onde else "")
        finally:
            sys.stdout, sys.stderr, builtins.input = stdout, stderr, entrada
            sys.path[:] = caminho_antigo
            os.chdir(pasta_antiga)
            for n in nomes_locais:
                sys.modules.pop(n, None)
        self.impresso.append(self.saida.getvalue() + self.erros.getvalue())
        return {"resultados": self.resultados, "erro": erro_import, "saida": "".join(self.impresso).strip()}


def correr_testes(pasta, ficheiro_testes):
    return json.dumps(Corredor(pasta, ficheiro_testes).correr(), ensure_ascii=False)

function realce(src){
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)\b/g;

let motor = null;
function carregarMotor(){
  if(motor) return motor;
  motor = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = `https://cdn.jsdelivr.net/pyodide/v${PYV}/full/pyodide.js`;
    s.onload = async () => {
      try { res(await loadPyodide({ indexURL:`https://cdn.jsdelivr.net/pyodide/v${PYV}/full/` })); }
      catch(e){ motor = null; rej(e); }
    };
    s.onerror = () => { motor = null; rej(new Error('Sem ligação ao motor de Python. Verifica a internet e tenta outra vez.')); };
    document.head.appendChild(s);
  });
  return motor;
}
async function correrPython(codigo){
  const py = await carregarMotor();
  const saida = [];
  py.setStdout({ batched: t => saida.push(t) });
  py.setStderr({ batched: t => saida.push(t) });
  try{ await py.loadPackagesFromImports(codigo); }catch(e){}
  const ns = py.runPython('{}');
  let erro = null;
  try{ py.runPython(codigo, { globals: ns }); }
  catch(e){ erro = String(e.message || e).trim().split('\n').filter(l => !l.includes('/lib/python3')).join('\n'); }
  ns.destroy();
  return { saida: saida.join('\n'), erro };

  try{ await py.loadPackagesFromImports(Object.values(ficheiros).join('\n')); }catch(e){}

function caixaQuiz(l){
  return `<div class="quiz"><h2>Verificação</h2>` + l.quiz.map((q, i) =>
    `<p>${emLinha(q.p)}</p>` + q.o.map((o, j) =>
      `<button class="opc" data-q="${i}" data-o="${j}">${emLinha(o)}</button>`).join('') +
    `<p class="mini" id="expl-${i}" hidden>${emLinha(q.e)}</p>`).join('') + `</div>`;
}

function vistaPraticar(){
  document.getElementById('sub').textContent = 'Todos os exercícios do curso, num sítio só.';
  const lst = prontas().filter(l => l.exercicio);
  app.innerHTML = `<h1>Praticar</h1>
    <p>Cada exercício é um ficheiro teu e um ficheiro de testes, na pasta do módulo. No fim do curso,
    <code>python -m pytest</code> na raiz do caderno corre a suite inteira: são ${lst.length} exercícios a provar que o que aprendeste continua a funcionar.</p>` +
    lst.map(l => `<a class="licao" href="#/l/${l.id}"><span class="id">${feitas[l.id] ? 'v' : l.id}</span>
      <span class="tt">${esc(l.titulo)}<br><span class="mini">${pastaDe(l)}/${esc(l.exercicio.ficheiro)}</span></span></a>`).join('');
}

function vistaPercurso(){
  const t = prontas().length, f = prontas().filter(l => feitas[l.id]).length;
  document.getElementById('sub').textContent = `${f} de ${t} aulas concluídas`;
  app.innerHTML = `<h1>Percurso</h1>
    <p>Aulas: ${t}. Concluídas: ${f}. Estão por ordem: cada uma usa só o que as anteriores ensinaram.
    Se saltares, volta atrás quando um exercício pedir uma coisa que não reconheces.</p>
    <h2>O que precisas de mostrar a quem recruta</h2>
    <ul>
      <li>Um repositório com testes a passar e um README que explica o problema, não a tecnologia.</li>
      <li>Histórico de commits pequenos e legíveis, feitos ao longo de semanas. O teu caderno já é isso.</li>
      <li>Um projeto que consuma dados reais e trate falhas.</li>
      <li>Saber explicar em voz alta uma decisão que tomaste e o que rejeitaste.</li>
    </ul>
    <p style="margin-top:26px"><button class="btn claro" id="limpar">Apagar o meu progresso</button></p>`;
  document.getElementById('limpar').onclick = () => {
    if(confirm('Apagar o progresso guardado neste dispositivo?')){
      feitas = {}; guarda('feitas', {});
      try{ Object.keys(localStorage).filter(k => k.startsWith(CH + 'passos:')).forEach(k => localStorage.removeItem(k)); }catch(e){}
      pintarBarra(); vistaPercurso();
    }
  };
}

/* ---------- interações ---------- */
function descarregar(nome, conteudo){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: 'text/x-python' }));
  a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function ligarBotoes(l){
  document.querySelectorAll('[data-correr]').forEach(b => {
    b.onclick = async () => {
      const pre = document.getElementById(b.dataset.correr);
      const out = document.getElementById('s-' + b.dataset.correr);
      out.hidden = false; out.className = 'saida'; out.textContent = 'A carregar o Python (só na primeira vez, cerca de 6 MB)...';
      b.disabled = true;
      try{
        const r = await correrPython(pre.textContent);
        // mostra a saída antes do erro: há blocos que imprimem e só depois rebentam de propósito
        out.textContent = (r.saida ? r.saida + '\n' : '') + (r.erro || (r.saida ? '' : '(sem saída)'));
        out.className = 'saida' + (r.erro ? ' mau' : '');
      }catch(e){ out.textContent = e.message; out.className = 'saida mau'; }
      b.disabled = false;
    };
  });
  document.querySelectorAll('[data-copiar]').forEach(b => {
    b.onclick = () => {
      navigator.clipboard.writeText(document.getElementById(b.dataset.copiar).textContent);
      b.textContent = 'Copiado';
      setTimeout(() => b.textContent = 'Copiar', 1500);
    };
  });
  document.querySelectorAll('[data-descarregar]').forEach(b => {
    b.onclick = () => descarregar(b.dataset.nome, document.getElementById(b.dataset.descarregar).textContent);
  });
  document.querySelectorAll('[data-passo]').forEach(c => {
    c.onchange = () => {
      const marcados = le('passos:' + l.id, {});
      marcados[c.dataset.passo] = c.checked;
      guarda('passos:' + l.id, marcados);
    };
  });
  const passou = document.getElementById('passou');
  if(passou) passou.onclick = () => {
    marcar(l.id); passou.textContent = 'Feito';
    document.getElementById('concluir').textContent = 'Aula concluída';
  };

  const ed = document.getElementById('editor');
  if(ed){
    // teclado auxiliar: os telemóveis não têm tab nem estes símbolos à mão
    const teclas = ['    ', ':', '(', ')', '[', ']', '{', '}', '"', '_', '=', '#'];
    document.getElementById('teclas').innerHTML = teclas.map(t =>
      `<button data-t="${t === '    ' ? 'IND' : esc(t)}">${t === '    ' ? '→|' : esc(t)}</button>`).join('');
    document.querySelectorAll('#teclas button').forEach(b => {
      b.onclick = () => inserir(ed, b.dataset.t === 'IND' ? '    ' : b.dataset.t);
    });
    ed.addEventListener('keydown', e => {
      if(e.key === 'Tab'){ e.preventDefault(); inserir(ed, '    '); }
    });
    document.getElementById('testar').onclick = async ev => {
      const res = document.getElementById('res');
      const ex = l.exercicio;
      res.innerHTML = '<div>A carregar o Python (só na primeira vez, cerca de 6 MB)...</div>';
      ev.target.disabled = true;
      try{
        const r = await correrTestes({ ...(ex.apoio || {}), [ex.ficheiro]: ed.value, [nomeTestes(ex)]: ex.testes }, nomeTestes(ex));
        const linhas = r.resultados.map(x =>
          `<div class="${x.ok ? 'ok' : 'mau'}">${x.ok ? 'v' : 'x'} ${esc(x.nome)}</div>` +
          (x.detalhe && !x.ok ? `<pre>${esc(x.detalhe)}</pre>` : '')).join('');
        const passou = !r.erro && r.resultados.length > 0 && r.resultados.every(x => x.ok);
        res.innerHTML = linhas +
          (r.erro ? `<div class="mau">Os testes nem chegaram a correr:</div><pre>${esc(r.erro)}</pre>` : '') +
          (r.saida ? `<pre style="padding:8px 0;font-size:16px">${esc(r.saida)}</pre>` : '') +
          (passou ? '<div class="ok" style="margin-top:8px">Todos os testes passam. Agora passa a solução para o teu editor e corre-os lá.</div>' : '');
      }catch(e){ res.innerHTML = `<div class="mau">${esc(e.message)}</div>`; }
      ev.target.disabled = false;
    };
  }

  document.querySelectorAll('.opc').forEach(b => {
    b.onclick = () => {
      const q = +b.dataset.q, o = +b.dataset.o;
      const certa = l.quiz[q].c;
      document.querySelectorAll(`.opc[data-q="${q}"]`).forEach(x => {
        if(+x.dataset.o === certa) x.classList.add('certa');
      });
      if(o !== certa) b.classList.add('errada');
      document.getElementById('expl-' + q).hidden = false;
    };
  });
}
function inserir(ed, txt){
  const i = ed.selectionStart, f = ed.selectionEnd;
  ed.value = ed.value.slice(0, i) + txt + ed.value.slice(f);
  ed.selectionStart = ed.selectionEnd = i + txt.length;
  ed.focus();
}

/* ---------- rotas ---------- */
function rotear(){
  const h = location.hash.replace('#/', '') || '';
  const p = h.split('/');
  window.scrollTo(0, 0);
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('on'));
  const marg = document.getElementById('marg');
  if(p[0] === 'm'){ vistaModulo(p[1]); marg.textContent = p[1]; document.getElementById('nav-curso').classList.add('on'); }
  else if(p[0] === 'l'){ vistaLicao(p[1]); marg.textContent = p[1]; document.getElementById('nav-curso').classList.add('on'); }
  else if(p[0] === 'praticar'){ vistaPraticar(); marg.textContent = 'ex'; document.getElementById('nav-praticar').classList.add('on'); }
  else if(p[0] === 'percurso'){ vistaPercurso(); marg.textContent = '%'; document.getElementById('nav-percurso').classList.add('on'); }
  else { vistaIndice(); marg.textContent = 'py'; document.getElementById('nav-curso').classList.add('on'); }
}
window.addEventListener('hashchange', rotear);
pintarBarra();
rotear();
</script>
